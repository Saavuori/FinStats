name: CI

# The Docker build only runs on pushes to main, so until this existed a pull
# request had no checks at all. Auto-merge needs something to wait for.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# One run per branch; a new push supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Go backend ────────────────────────────────────────────────────────────
  # `//go:embed all:dist` is satisfied by the committed .gitkeep placeholder,
  # so the backend builds on its own without the frontend bundle.
  backend:
    name: go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # ── Vite frontend ─────────────────────────────────────────────────────────
  frontend:
    name: vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Matches the frontend-builder stage in the Dockerfile. Bump both together.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Unit tests for the parts that decide what a view shows: the URL state,
      # the chart's reading of a cube, map-level detection and joins, colour
      # classes and the CSV export.
      - name: Test
        run: npm test

      # `tsc -b && vite build` — the typecheck is the half that catches a
      # dependency bump changing types out from under us. It can't catch a
      # bump that breaks at runtime: maplibre-gl 6 built cleanly here while the
      # live map stayed blank for two months, because its worker never made it
      # into the bundle. The check below guards that one specifically.
      - name: Build
        run: npm run build

      - name: Map worker is bundled
        run: |
          ls dist/assets/maplibre-gl-worker-*.js >/dev/null 2>&1 || {
            echo "::error::dist/assets has no maplibre-gl-worker-*.js; the map would render blank (see MapView.tsx)"
            exit 1
          }
