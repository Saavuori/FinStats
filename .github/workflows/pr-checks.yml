name: PR Checks

# These two job names are not cosmetic: main's branch protection requires the
# contexts "go" and "vite build" by name. They were required long before any
# workflow produced them, which left auto-merge waiting on checks that could
# never report. Renaming a job here silently breaks merging again.
on:
  pull_request:
    branches: ["main"]

# No paths-ignore on purpose: a required status check must always report a
# result, otherwise doc-only PRs stay pending forever and block merge.

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cache is off because the backend is stdlib-only and has no go.sum for
      # setup-go to key on.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # CGO_ENABLED=0 keeps the binary static, which is what the alpine runtime
      # stage in the Dockerfile expects.
      - name: Build
        working-directory: backend
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        working-directory: backend
        run: CGO_ENABLED=0 go test ./...

  vite-build:
    name: vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22 matches the frontend-builder stage in the Dockerfile, so CI
      # compiles on the same major that ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `npm run build` runs `tsc -b && vite build` — this is what proves the
      # app actually compiles, types included.
      - name: Build
        working-directory: frontend
        run: npm run build
