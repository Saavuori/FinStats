<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>finstats Changelog — Statistics Finland data explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0a0f1e;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-blue: #3987e5;
      --accent-sky: #5aa9f0;
      --border-glow: rgba(255, 255, 255, 0.05);
      --glass-bg: rgba(15, 23, 42, 0.65);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0; padding: 0; line-height: 1.6; min-height: 100vh;
      background-image:
        radial-gradient(at 0% 0%, rgba(57, 135, 229, 0.10) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(90, 169, 240, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .container { max-width: 800px; margin: 0 auto; padding: 60px 20px; position: relative; }

    header { text-align: center; margin-bottom: 60px; }
    header h1 {
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 3rem;
      margin: 0 0 10px 0; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #8fc6f6 0%, #3987e5 50%, #2a78d6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(57, 135, 229, 0.2));
    }
    header p { color: var(--text-secondary); font-size: 1.1rem; margin: 0; font-weight: 500; }

    .changelog-content { position: relative; padding-left: 32px; border-left: 2px solid rgba(255, 255, 255, 0.06); margin-left: 10px; }
    hr { display: none; }

    .version-header { position: relative; margin-top: 50px; }
    .version-header::before {
      content: ''; position: absolute; left: -43px; top: 10px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--bg-color); border: 4px solid var(--accent-blue);
      box-shadow: 0 0 12px var(--accent-blue); transition: all 0.3s ease; z-index: 2;
    }
    .version-header:hover::before { background: var(--accent-blue); transform: scale(1.2); }
    .version-header h2 {
      margin: 0 0 20px 0; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.65rem;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .version-tag {
      background: rgba(57, 135, 229, 0.1); border: 1px solid rgba(57, 135, 229, 0.25);
      color: var(--accent-sky); padding: 4px 12px; border-radius: 9999px;
      font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em;
    }
    .version-date { color: var(--text-secondary); font-size: 1rem; font-weight: 500; }

    .version-card {
      background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glow); border-radius: 16px; padding: 24px 30px; margin-bottom: 50px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .version-card:hover { border-color: rgba(57, 135, 229, 0.2); box-shadow: 0 15px 35px -8px rgba(57, 135, 229, 0.08); }

    h3 {
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.1rem; margin: 25px 0 12px 0;
      text-transform: uppercase; letter-spacing: 0.08em; display: inline-flex; align-items: center; gap: 6px;
    }
    h3:first-of-type { margin-top: 0; }
    .category-added { color: #34d399; }
    .category-fixed { color: #fbbf24; }
    .category-changed { color: #60a5fa; }
    .category-removed { color: #f87171; }
    .category-notes { color: var(--text-secondary); }

    ul { margin: 0 0 20px 0; padding-left: 20px; list-style-type: none; }
    li { margin-bottom: 10px; position: relative; color: #cbd5e1; font-size: 0.95rem; }
    li::before { content: "•"; color: rgba(255, 255, 255, 0.25); font-size: 1.2rem; position: absolute; left: -16px; top: -2px; }

    strong { color: var(--text-primary); font-weight: 600; }
    code {
      font-family: 'Courier New', monospace; background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05); color: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.85em;
    }
    a { color: var(--accent-sky); text-decoration: none; border-bottom: 1px dashed rgba(90, 169, 240, 0.4); }
    a:hover { color: #2a78d6; border-bottom-style: solid; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; font-weight: 500; }
    .back-link:hover { color: var(--text-primary); }

    footer { text-align: center; margin-top: 60px; color: #64748b; font-size: 0.8rem; font-family: monospace; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 30px; }

    @media (max-width: 600px) {
      header h1 { font-size: 2.2rem; }
      .version-card { padding: 20px 22px; }
      .changelog-content { padding-left: 20px; }
      .version-header::before { left: -31px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="https://finstats.duckdns.org/" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to the explorer
    </a>

    <header>
      <h1>finstats Changelog</h1>
      <p>Release notes for the Statistics Finland data explorer</p>
    </header>

    <div class="changelog-content">
      {{CONTENT}}
    </div>

    <footer>
      <span>FINSTATS // DEPLOYED AT {{BUILD_DATE}}</span>
    </footer>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const content = document.querySelector(".changelog-content");
      if (!content) return;
      const children = Array.from(content.children);
      let currentCard = null;
      children.forEach((child) => {
        if (child.classList.contains("version-header")) {
          currentCard = document.createElement("div");
          currentCard.className = "version-card";
          content.insertBefore(currentCard, child.nextSibling);
        } else if (currentCard && child !== currentCard) {
          currentCard.appendChild(child);
        }
      });
    });
  </script>
</body>
</html>
